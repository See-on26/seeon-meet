<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>seeon 시연 창</title>
  <style>
    :root { color-scheme: dark; --font-size: 44px; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
    html, body { margin: 0; height: 100%; background: #000; color: #fff; }
    #cardList { height: 100%; overflow-y: auto; padding: 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; }
    .card { border-left: 8px solid #0a84ff; padding: 12px 20px; background: #111; border-radius: 8px; }
    .badge { display: inline-block; font-size: calc(var(--font-size) * 0.45); padding: 4px 12px; border-radius: 999px; background: #0a84ff; margin-bottom: 8px; }
    .text { font-size: var(--font-size); line-height: 1.35; font-weight: 600; }
    .rationale { font-size: calc(var(--font-size) * 0.4); color: #a1a1a6; margin-top: 8px; display: none; }
    body.is-rationale-visible .rationale { display: block; }
    .hint { position: fixed; right: 16px; bottom: 12px; font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <div id="cardList" aria-live="polite"></div>
  <div class="hint">G 근거 · +/− 글자 크기 · C 지우기</div>
  <script type="module" src="./demo.js"></script>
</body>
</html>
