<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>seeon — 실시간 회의 캡션</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #0066cc;
      --ink: #1d1d1f;
      --ink-muted-80: #333333;
      --ink-muted-48: #7a7a7a;
      --canvas: #ffffff;
      --parchment: #f5f5f7;
      --hairline: #e0e0e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 12px; background: var(--parchment); color: var(--ink);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
      letter-spacing: -0.2px;
    }
    .col { display: flex; flex-direction: column; gap: 12px; height: calc(100vh - 24px); }
    .panel {
      background: var(--canvas); border: 1px solid var(--hairline);
      border-radius: 14px; padding: 12px 14px;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    button {
      font: inherit; padding: 7px 14px; border-radius: 9px; cursor: pointer;
      background: var(--primary); color: #fff; border: 1px solid var(--primary);
    }
    button.secondary { background: var(--canvas); color: var(--ink); border-color: var(--hairline); }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button.on { background: var(--ink); border-color: var(--ink); }

    .modebar { display: flex; gap: 8px; }
    .mode-btn {
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      background: var(--canvas); color: var(--ink); border: 1px solid var(--hairline);
      padding: 8px 12px; text-align: left;
      /* 버튼 폭을 글자 길이가 아니라 남은 폭으로 정한다 — 네 개가 늘 한 줄에 들어간다. */
      flex: 1 1 0; min-width: 0;
    }
    .mode-btn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .mode-name { font-weight: 600; white-space: nowrap; }
    /* keep-all: 한국어를 어절 단위로 끊는다("회/수" 방지). anywhere: 그래도 안 들어가면 마지막 수단. */
    .mode-out { font-size: 12px; opacity: .7; word-break: keep-all; overflow-wrap: anywhere; }
    .mode-note { margin-top: 8px; font-size: 12px; color: var(--ink-muted-48); }

    .status { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-muted-80); }
    .status b { font-weight: 600; color: var(--ink-muted-48); font-size: 12px; margin-right: 4px; }

    #captionBar {
      flex: 1; display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 22px; line-height: 1.5; padding: 24px;
      white-space: pre-wrap;
    }
    #captionBar.empty { color: var(--ink-muted-48); font-size: 15px; }

    #prepOverlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, .72); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      font-size: 18px; z-index: 10;
    }
    #prepOverlay[hidden] { display: none; }

    dialog#permModal {
      background: var(--canvas); color: var(--ink); border: 1px solid var(--hairline);
      border-radius: 18px; padding: 24px; max-width: 440px;
    }
    dialog#permModal::backdrop { background: rgba(0, 0, 0, .4); }
    dialog#permModal h3 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
    dialog#permModal p { margin: 0 0 16px; color: var(--ink-muted-80); white-space: pre-line; }
    dialog#permModal .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="col">
    <div class="panel row">
      <button id="toggleBtn" disabled>회의 캡처 시작</button>
      <button class="secondary" id="pauseBtn" disabled>일시정지</button>
      <label><input type="checkbox" id="pipeChk" checked /> 캡션 파이프라인</label>
      <span id="meetHint" style="color: var(--ink-muted-48)"></span>
    </div>

    <div class="panel">
      <div class="modebar" id="modeBar"></div>
      <div class="mode-note" id="modeNote"></div>
    </div>

    <div class="panel status">
      <span><b>캡처</b><span id="stCapture">off</span></span>
      <span><b>해상도</b><span id="stRes">–</span></span>
      <span><b>나레이션</b><span id="stDelay">–</span></span>
      <span><b>버퍼</b><span id="stBuffer">–</span></span>
    </div>

    <div class="panel empty" id="captionBar">왼쪽 Meet 창에서 회의에 참여한 뒤 캡처를 시작하세요.</div>
  </div>

  <div id="prepOverlay" hidden>
    <div>회의 소리를 모으는 중입니다</div>
    <div id="prepRemain"></div>
  </div>

  <dialog id="permModal">
    <h3 id="permTitle"></h3>
    <p id="permMessage"></p>
    <div class="btns" id="permBtns"></div>
  </dialog>

  <script type="module" src="./main.js"></script>
</body>
</html>
